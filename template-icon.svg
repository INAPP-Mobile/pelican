  <!-- Eye -->
  <circle cx="155" cy="115" r="8" fill="#38bdf8"/>
  <circle cx="155" cy="115" r="3" fill="#0f172a"/>
  <!-- Wing -->
  <path d="M85 130 Q70 145 80 165" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Server rack lines -->
  <line x1="40" y1="210" x2="216" y2="210" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="220" x2="216" y2="220" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
</svg>
